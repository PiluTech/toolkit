# Catálogo padrão embutido no binário. Formato em docs/catalogo.md.
#
# O bloco opcional `detect` diz como achar o app já instalado FORA do gerenciador (só leitura): o .app do .dmg no
# macOS, o programa do instalador no Windows, o .desktop ou o snap no Linux. Só entram valores conhecidos; sem
# certeza, o app fica sem o bloco (python não tem, e git só tem o do Windows: no macOS e no Linux ele é linha de
# comando, sem app).
apps:
  git:
    name: Git
    category: dev
    versions: true
    windows: [{ provider: winget, id: Git.Git }]
    macos:   [{ provider: brew, formula: git }]
    linux:
      - { provider: apt, package: git }
      - { provider: dnf, package: git }
      - { provider: pacman, package: git }
    detect:
      windows: { display_name: Git }

  vscode:
    name: Visual Studio Code
    category: dev
    windows: [{ provider: winget, id: Microsoft.VisualStudioCode }]
    macos:   [{ provider: brew, cask: visual-studio-code }]
    linux:   [{ provider: flatpak, id: com.visualstudio.code }]
    detect:
      macos:   { app_bundle: "Visual Studio Code.app", bundle_id: com.microsoft.VSCode }
      windows: { display_name: Microsoft Visual Studio Code }
      linux:   { desktop_id: code.desktop, snap: code }

  python:
    name: Python
    category: dev
    versions: ["3.13", "3.12", "3.11"]
    windows: [{ provider: winget, id: "Python.Python.{{major_minor}}" }]
    macos:   [{ provider: brew, formula: "python@{{major_minor}}" }]
    linux:   [{ provider: apt, package: "python{{major_minor}}" }]

  discord:
    name: Discord
    category: comunicacao
    windows: [{ provider: winget, id: Discord.Discord }]
    macos:   [{ provider: brew, cask: discord }]
    linux:
      - { provider: flatpak, id: com.discordapp.Discord }
    detect:
      macos:   { app_bundle: Discord.app, bundle_id: com.hnc.Discord }
      windows: { display_name: Discord }
      linux:   { desktop_id: discord.desktop, snap: discord }

  firefox:
    name: Mozilla Firefox
    category: navegadores
    windows: [{ provider: winget, id: Mozilla.Firefox }]
    macos:   [{ provider: brew, cask: firefox }]
    linux:   [{ provider: flatpak, id: org.mozilla.firefox }]
    detect:
      macos:   { app_bundle: Firefox.app, bundle_id: org.mozilla.firefox }
      windows: { display_name: Mozilla Firefox }
      linux:   { desktop_id: firefox.desktop, snap: firefox }

  vlc:
    name: VLC
    category: midia
    windows: [{ provider: winget, id: VideoLAN.VLC }]
    macos:   [{ provider: brew, cask: vlc }]
    linux:   [{ provider: flatpak, id: org.videolan.VLC }]
    detect:
      macos:   { app_bundle: VLC.app, bundle_id: org.videolan.vlc }
      windows: { display_name: VLC media player }
      linux:   { desktop_id: vlc.desktop, snap: vlc }

  7zip:
    name: 7-Zip
    category: utilitarios
    windows: [{ provider: winget, id: 7zip.7zip }]
    macos:   [{ provider: brew, formula: sevenzip }]
    linux:
      - { provider: apt, package: p7zip-full }
      - { provider: dnf, package: p7zip }
      - { provider: pacman, package: p7zip }
    detect:
      windows: { display_name: 7-Zip }
