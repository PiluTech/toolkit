id: diag-rede
name: Diagnóstico de rede
description: Interfaces, rota padrão, DNS, alcance (ping e HTTPS), Wi-Fi e portas em escuta. Só leitura, sem sudo; mostra os endereços e o nome do Wi-Fi como o sistema informa.
os: macos
kind: diagnostic
# Alvos externos (variáveis de ambiente, todas opcionais):
#   TOOLKIT_DIAG_HOST  host para o ping            (padrão 1.1.1.1)
#   TOOLKIT_DIAG_NAME  nome para a resolução DNS   (padrão example.com)
#   TOOLKIT_DIAG_URL   URL https para o teste      (padrão https://example.com/)
# Idioma da saída: TOOLKIT_LANG, LC_ALL, LC_MESSAGES ou LANG (pt, en ou es; padrão pt-BR).
steps:
  - id: interfaces
    name: Interfaces, MTU e rota padrão
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_ifs="Interfaces with an address (state, MTU, addresses)"; m_route="Default route"; m_noroute="no default route"; m_noifc="the 'ifconfig' command is not available" ;;
          es) m_ifs="Interfaces con dirección (estado, MTU, direcciones)"; m_route="Ruta predeterminada"; m_noroute="sin ruta predeterminada"; m_noifc="el comando 'ifconfig' no está disponible" ;;
          *) m_ifs="Interfaces com endereço (estado, MTU, endereços)"; m_route="Rota padrão"; m_noroute="sem rota padrão"; m_noifc="o comando 'ifconfig' não existe" ;;
        esac
        if ! command -v ifconfig >/dev/null 2>&1; then printf '%s\n' "$m_noifc"; exit 0; fi
        printf '== %s\n' "$m_ifs"
        ifconfig -a 2>&1 | awk '
          function flush() { if (n != "" && addrs != "") printf "%-8s %-9s mtu %-6s%s\n", n, (st == "" ? "-" : st), (mtu == "" ? "?" : mtu), addrs }
          /^[A-Za-z0-9]+:/ { flush(); n = $1; sub(/:$/, "", n); mtu = ""; st = ""; addrs = ""; for (i = 1; i <= NF; i++) if ($i == "mtu") mtu = $(i + 1); next }
          $1 == "inet" { addrs = addrs " " $2 }
          $1 == "inet6" { a = $2; sub(/%.*/, "", a); addrs = addrs " " a }
          $1 == "status:" { st = $2 }
          END { flush() }'
        printf '\n== %s\n' "$m_route"
        r="$(route -n get default 2>/dev/null | awk '/gateway:|interface:/ { print $1 " " $2 }'; route -n get -inet6 default 2>/dev/null | awk '/gateway:|interface:/ { print "ipv6 " $1 " " $2 }')"
        if [ -z "$r" ]; then printf '%s\n' "$m_noroute"; else printf '%s\n' "$r"; fi
    timeout: 30s
  - id: dns
    name: DNS configurado e resolução de um nome
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_conf="DNS servers in use"; m_noconf="no DNS configuration found"; m_resolve="Name resolution"; m_ok="ok"; m_fail="failed"; m_nores="the 'dscacheutil' command is not available"; m_badname="invalid TOOLKIT_DIAG_NAME (use letters, digits, dot, hyphen)" ;;
          es) m_conf="Servidores DNS en uso"; m_noconf="no se encontró configuración de DNS"; m_resolve="Resolución de nombre"; m_ok="ok"; m_fail="falló"; m_nores="el comando 'dscacheutil' no está disponible"; m_badname="TOOLKIT_DIAG_NAME inválido (use letras, dígitos, punto, guion)" ;;
          *) m_conf="Servidores DNS em uso"; m_noconf="nenhuma configuração de DNS encontrada"; m_resolve="Resolução de nome"; m_ok="ok"; m_fail="falhou"; m_nores="o comando 'dscacheutil' não existe"; m_badname="TOOLKIT_DIAG_NAME inválido (use letras, dígitos, ponto, hífen)" ;;
        esac
        name="${TOOLKIT_DIAG_NAME:-example.com}"
        case "$name" in ''|-*|*[!A-Za-z0-9._-]*) printf '%s\n' "$m_badname"; exit 0 ;; esac
        printf '== %s\n' "$m_conf"
        c="$(scutil --dns 2>/dev/null | awk '/scoped queries/ { exit } /nameserver\[[0-9]+\]/ { print $3 }' | sort -u | head -n 10)"
        if [ -n "$c" ]; then printf '%s\n' "$c"; else printf '%s\n' "$m_noconf"; fi
        printf '\n== %s: %s\n' "$m_resolve" "$name"
        if ! command -v dscacheutil >/dev/null 2>&1; then printf '%s\n' "$m_nores"; exit 0; fi
        res="$(dscacheutil -q host -a name "$name" 2>/dev/null | awk '/^(ip_address|ipv6_address):/ { print $2 }' | sort -u | head -n 6)"
        if [ -n "$res" ]; then printf '%s\n' "$m_ok"; printf '%s\n' "$res"; else printf '%s\n' "$m_fail"; fi
    timeout: 30s
  - id: alcance
    name: Alcance por ping e por HTTPS
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_ok="ok"; m_fail="failed"; m_gw="Gateway (ping)"; m_nogw="no default gateway to test"; m_ping="Ping"; m_noping="the 'ping' command is not available"; m_https="HTTPS"; m_nocurl="the 'curl' command is not available"; m_unexpected="unexpected response"; m_badhost="invalid TOOLKIT_DIAG_HOST (use letters, digits, dot, colon, hyphen)"; m_badurl="invalid TOOLKIT_DIAG_URL (use https:// followed by host and path with letters, digits, . _ ~ : / -)" ;;
          es) m_ok="ok"; m_fail="falló"; m_gw="Gateway (ping)"; m_nogw="sin gateway predeterminado para probar"; m_ping="Ping"; m_noping="el comando 'ping' no está disponible"; m_https="HTTPS"; m_nocurl="el comando 'curl' no está disponible"; m_unexpected="respuesta inesperada"; m_badhost="TOOLKIT_DIAG_HOST inválido (use letras, dígitos, punto, dos puntos, guion)"; m_badurl="TOOLKIT_DIAG_URL inválida (use https:// seguido de host y ruta con letras, dígitos, . _ ~ : / -)" ;;
          *) m_ok="ok"; m_fail="falhou"; m_gw="Gateway (ping)"; m_nogw="sem gateway padrão para testar"; m_ping="Ping"; m_noping="o comando 'ping' não existe"; m_https="HTTPS"; m_nocurl="o comando 'curl' não existe"; m_unexpected="resposta inesperada"; m_badhost="TOOLKIT_DIAG_HOST inválido (use letras, dígitos, ponto, dois-pontos, hífen)"; m_badurl="TOOLKIT_DIAG_URL inválida (use https:// seguido de host e caminho com letras, dígitos, . _ ~ : / -)" ;;
        esac
        host="${TOOLKIT_DIAG_HOST:-1.1.1.1}"
        url="${TOOLKIT_DIAG_URL:-https://example.com/}"
        case "$host" in ''|-*|*[!A-Za-z0-9._:-]*) printf '%s\n' "$m_badhost"; exit 0 ;; esac
        case "$url" in https://*) ;; *) printf '%s\n' "$m_badurl"; exit 0 ;; esac
        case "${url#https://}" in ''|-*|*[!A-Za-z0-9._~:/-]*) printf '%s\n' "$m_badurl"; exit 0 ;; esac
        probe() {
          if out="$(ping -c 3 -t 6 "$2" 2>&1)"; then st="$m_ok"; else st="$m_fail"; fi
          printf '%s: %s\n' "$1" "$st"
          printf '%s\n' "$out" | tail -n 2
        }
        if command -v ping >/dev/null 2>&1; then
          gw="$(route -n get default 2>/dev/null | awk '/gateway:/ { print $2; exit }')"
          case "$gw" in ''|-*|*[!A-Za-z0-9._:-]*) printf '%s: %s\n' "$m_gw" "$m_nogw" ;; *) probe "$m_gw" "$gw" ;; esac
          printf '\n'
          probe "$m_ping $host" "$host"
        else
          printf '%s\n' "$m_noping"
        fi
        printf '\n'
        if command -v curl >/dev/null 2>&1; then
          if res="$(env -u SSLKEYLOGFILE curl -q -sS -L --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code} %{time_connect} %{time_appconnect} %{time_total}' "$url" 2>&1)"; then
            set -- $res
            case "$1" in 2*|3*) st="$m_ok" ;; *) st="$m_unexpected" ;; esac
            printf '%s %s: %s (HTTP %s; tcp %s s; tls %s s; total %s s)\n' "$m_https" "$url" "$st" "$1" "$2" "$3" "$4"
          else
            printf '%s %s: %s\n' "$m_https" "$url" "$m_fail"
            printf '%s\n' "$res" | tail -n 1
          fi
        else
          printf '%s\n' "$m_nocurl"
        fi
    timeout: 1m
  - id: wifi
    name: Wi-Fi atual
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_nonet="'networksetup' not available: Wi-Fi not checked"; m_nowifi="no Wi-Fi adapter found"; m_dev="Adapter"; m_power="power"; m_net="network"; m_notassoc="not connected, or macOS did not report the network (Location Services permission)" ;;
          es) m_nonet="'networksetup' no disponible: Wi-Fi no verificado"; m_nowifi="no se encontró adaptador Wi-Fi"; m_dev="Adaptador"; m_power="energía"; m_net="red"; m_notassoc="sin conexión, o macOS no informó la red (permiso de Localización)" ;;
          *) m_nonet="'networksetup' indisponível: Wi-Fi não verificado"; m_nowifi="nenhum adaptador Wi-Fi encontrado"; m_dev="Adaptador"; m_power="energia"; m_net="rede"; m_notassoc="sem conexão, ou o macOS não informou a rede (permissão de Localização)" ;;
        esac
        if ! command -v networksetup >/dev/null 2>&1; then printf '%s\n' "$m_nonet"; exit 0; fi
        dev="$(networksetup -listallhardwareports 2>/dev/null | awk '/^Hardware Port: Wi-Fi$/ { f = 1; next } f && /^Device:/ { print $2; exit }')"
        case "$dev" in ''|-*|*[!A-Za-z0-9]*) printf '%s\n' "$m_nowifi"; exit 0 ;; esac
        pw="$(networksetup -getairportpower "$dev" 2>/dev/null | awk '{ print $NF }')"
        printf '%s %s: %s %s\n' "$m_dev" "$dev" "$m_power" "$pw"
        ssid="$(networksetup -getairportnetwork "$dev" 2>/dev/null | sed -n 's/^Current Wi-Fi Network: //p')"
        if [ -n "$ssid" ]; then
          printf '%s: %s\n' "$m_net" "$ssid"
        else
          printf '%s\n' "$m_notassoc"
        fi
    timeout: 30s
  - id: portas
    name: Portas TCP em escuta
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_head="Listening TCP ports (only this machine / whole network)"; m_local="this machine only"; m_net="whole network"; m_none="no listening ports found"; m_nons="the 'netstat' command is not available" ;;
          es) m_head="Puertos TCP en escucha (solo este equipo / toda la red)"; m_local="solo este equipo"; m_net="toda la red"; m_none="no se encontraron puertos en escucha"; m_nons="el comando 'netstat' no está disponible" ;;
          *) m_head="Portas TCP em escuta (só esta máquina / toda a rede)"; m_local="só esta máquina"; m_net="toda a rede"; m_none="nenhuma porta em escuta"; m_nons="o comando 'netstat' não existe" ;;
        esac
        if ! command -v netstat >/dev/null 2>&1; then printf '%s\n' "$m_nons"; exit 0; fi
        printf '== %s\n' "$m_head"
        out="$(netstat -an -p tcp 2>/dev/null | awk -v l="$m_local" -v n="$m_net" '$NF == "LISTEN" { a = $4; p = a; sub(/.*\./, "", p); h = a; sub(/\.[^.]*$/, "", h); if (h ~ /^127\./ || h == "::1") w = l; else w = n; print p " " w }' | sort -n | uniq | head -n 40)"
        if [ -z "$out" ]; then printf '%s\n' "$m_none"; else printf '%s\n' "$out"; fi
    timeout: 30s
