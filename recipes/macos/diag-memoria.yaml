id: diag-memoria
name: Diagnóstico de memória e disco
description: Mostra memória, discos e uso de espaço. Só leitura.
os: macos
kind: diagnostic
steps:
  - id: memoria
    name: Memória
    render: macos-memory
    run:
      sh: |
        echo "### memsize"
        sysctl -n hw.memsize
        echo "### vm_stat"
        vm_stat
        echo "### profiler"
        system_profiler SPMemoryDataType -json
  - id: discos
    name: Discos
    render: macos-disks
    run:
      sh: |
        echo "### profiler"
        system_profiler SPNVMeDataType SPSerialATADataType SPStorageDataType -json
        printf '\n### apfs\n'
        diskutil apfs list -plist
  - id: espaco
    name: Espaço usado
    run: { sh: "df -h" }
