id: diag-memoria
name: Diagnóstico de memória e disco
description: Mostra memória, discos e uso de espaço. Só leitura.
os: macos
kind: diagnostic
steps:
  - id: memoria
    name: Memória
    run: { sh: "vm_stat" }
  - id: discos
    name: Discos
    run: { sh: "diskutil list" }
  - id: espaco
    name: Espaço usado
    run: { sh: "df -h" }
