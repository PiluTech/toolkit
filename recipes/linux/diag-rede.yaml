id: diag-rede
name: Diagnóstico de rede
description: Interfaces, rota padrão, DNS, alcance (ping e HTTPS), Wi-Fi e portas em escuta. Só leitura, sem sudo; mostra os endereços e o nome do Wi-Fi como o sistema informa.
os: linux
kind: diagnostic
# Alvos externos (variáveis de ambiente, todas opcionais):
#   TOOLKIT_DIAG_HOST  host para o ping            (padrão 1.1.1.1)
#   TOOLKIT_DIAG_NAME  nome para a resolução DNS   (padrão example.com)
#   TOOLKIT_DIAG_URL   URL https para o teste      (padrão https://example.com/)
# Idioma da saída: TOOLKIT_LANG, LC_ALL, LC_MESSAGES ou LANG (pt, en ou es; padrão pt-BR).
steps:
  - id: interfaces
    name: Interfaces, MTU e rota padrão
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_addr="Addresses"; m_mtu="Interfaces (state and MTU)"; m_route="Default route"; m_noroute="no default route"; m_noip="the 'ip' command is not available on this system" ;;
          es) m_addr="Direcciones"; m_mtu="Interfaces (estado y MTU)"; m_route="Ruta predeterminada"; m_noroute="sin ruta predeterminada"; m_noip="el comando 'ip' no está disponible en este sistema" ;;
          *) m_addr="Endereços"; m_mtu="Interfaces (estado e MTU)"; m_route="Rota padrão"; m_noroute="sem rota padrão"; m_noip="o comando 'ip' não existe neste sistema" ;;
        esac
        if ! command -v ip >/dev/null 2>&1; then printf '%s\n' "$m_noip"; exit 0; fi
        printf '== %s\n' "$m_addr"
        ip -brief address show 2>&1
        printf '\n== %s\n' "$m_mtu"
        ip -o link show 2>&1 | awk '{ n = $2; sub(/:$/, "", n); sub(/@.*/, "", n); m = "?"; s = "?"; for (i = 1; i <= NF; i++) { if ($i == "mtu") m = $(i + 1); if ($i == "state") s = $(i + 1) } printf "%-16s %-8s mtu %s\n", n, s, m }'
        printf '\n== %s\n' "$m_route"
        r="$(ip route show default 2>/dev/null; ip -6 route show default 2>/dev/null)"
        if [ -z "$r" ]; then printf '%s\n' "$m_noroute"; else printf '%s\n' "$r"; fi
    timeout: 30s
  - id: dns
    name: DNS configurado e resolução de um nome
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_conf="DNS servers in use"; m_noconf="no DNS configuration found"; m_resolve="Name resolution"; m_ok="ok"; m_fail="failed"; m_nores="no resolver tool available (getent, host or nslookup)"; m_badname="invalid TOOLKIT_DIAG_NAME (use letters, digits, dot, hyphen)" ;;
          es) m_conf="Servidores DNS en uso"; m_noconf="no se encontró configuración de DNS"; m_resolve="Resolución de nombre"; m_ok="ok"; m_fail="falló"; m_nores="no hay herramienta de resolución (getent, host o nslookup)"; m_badname="TOOLKIT_DIAG_NAME inválido (use letras, dígitos, punto, guion)" ;;
          *) m_conf="Servidores DNS em uso"; m_noconf="nenhuma configuração de DNS encontrada"; m_resolve="Resolução de nome"; m_ok="ok"; m_fail="falhou"; m_nores="nenhuma ferramenta de resolução (getent, host ou nslookup)"; m_badname="TOOLKIT_DIAG_NAME inválido (use letras, dígitos, ponto, hífen)" ;;
        esac
        name="${TOOLKIT_DIAG_NAME:-example.com}"
        case "$name" in ''|-*|*[!A-Za-z0-9._-]*) printf '%s\n' "$m_badname"; exit 0 ;; esac
        printf '== %s\n' "$m_conf"
        if command -v resolvectl >/dev/null 2>&1 && resolvectl status >/dev/null 2>&1; then
          resolvectl status 2>/dev/null | grep -E 'Current DNS Server|DNS Servers' | sed 's/^[[:space:]]*//' | sort -u | head -n 20
        elif [ -r /etc/resolv.conf ]; then
          grep -E '^nameserver' /etc/resolv.conf | head -n 10
        else
          printf '%s\n' "$m_noconf"
        fi
        printf '\n== %s: %s\n' "$m_resolve" "$name"
        res=""; have=1
        if command -v getent >/dev/null 2>&1; then
          res="$(getent ahosts "$name" 2>/dev/null | awk '{ print $1 }' | sort -u | head -n 6)"
        elif command -v host >/dev/null 2>&1; then
          res="$(host "$name" 2>/dev/null | awk '/ has (IPv6 )?address / { print $NF }' | sort -u | head -n 6)"
        elif command -v nslookup >/dev/null 2>&1; then
          res="$(env HOME=/ nslookup "$name" 2>/dev/null | awk '/^Address/ && !/#/ { print $NF }' | sort -u | head -n 6)"
        else
          have=0
        fi
        if [ "$have" = 0 ]; then printf '%s\n' "$m_nores"
        elif [ -n "$res" ]; then printf '%s\n' "$m_ok"; printf '%s\n' "$res"
        else printf '%s\n' "$m_fail"; fi
    timeout: 30s
  - id: alcance
    name: Alcance por ping e por HTTPS
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_ok="ok"; m_fail="failed"; m_gw="Gateway (ping)"; m_nogw="no default gateway to test"; m_ping="Ping"; m_noping="the 'ping' command is not available"; m_https="HTTPS"; m_nocurl="the 'curl' command is not available"; m_unexpected="unexpected response"; m_badhost="invalid TOOLKIT_DIAG_HOST (use letters, digits, dot, colon, hyphen)"; m_badurl="invalid TOOLKIT_DIAG_URL (use https:// followed by host and path with letters, digits, . _ ~ : / -)" ;;
          es) m_ok="ok"; m_fail="falló"; m_gw="Gateway (ping)"; m_nogw="sin gateway predeterminado para probar"; m_ping="Ping"; m_noping="el comando 'ping' no está disponible"; m_https="HTTPS"; m_nocurl="el comando 'curl' no está disponible"; m_unexpected="respuesta inesperada"; m_badhost="TOOLKIT_DIAG_HOST inválido (use letras, dígitos, punto, dos puntos, guion)"; m_badurl="TOOLKIT_DIAG_URL inválida (use https:// seguido de host y ruta con letras, dígitos, . _ ~ : / -)" ;;
          *) m_ok="ok"; m_fail="falhou"; m_gw="Gateway (ping)"; m_nogw="sem gateway padrão para testar"; m_ping="Ping"; m_noping="o comando 'ping' não existe"; m_https="HTTPS"; m_nocurl="o comando 'curl' não existe"; m_unexpected="resposta inesperada"; m_badhost="TOOLKIT_DIAG_HOST inválido (use letras, dígitos, ponto, dois-pontos, hífen)"; m_badurl="TOOLKIT_DIAG_URL inválida (use https:// seguido de host e caminho com letras, dígitos, . _ ~ : / -)" ;;
        esac
        host="${TOOLKIT_DIAG_HOST:-1.1.1.1}"
        url="${TOOLKIT_DIAG_URL:-https://example.com/}"
        case "$host" in ''|-*|*[!A-Za-z0-9._:-]*) printf '%s\n' "$m_badhost"; exit 0 ;; esac
        case "$url" in https://*) ;; *) printf '%s\n' "$m_badurl"; exit 0 ;; esac
        case "${url#https://}" in ''|-*|*[!A-Za-z0-9._~:/-]*) printf '%s\n' "$m_badurl"; exit 0 ;; esac
        probe() {
          if out="$(ping -c 3 -W 2 "$2" 2>&1)"; then st="$m_ok"; else st="$m_fail"; fi
          printf '%s: %s\n' "$1" "$st"
          printf '%s\n' "$out" | tail -n 2
        }
        if command -v ping >/dev/null 2>&1; then
          gw=""
          if command -v ip >/dev/null 2>&1; then gw="$(ip route show default 2>/dev/null | awk '/^default/ { print $3; exit }')"; fi
          case "$gw" in ''|-*|*[!A-Za-z0-9._:-]*) printf '%s: %s\n' "$m_gw" "$m_nogw" ;; *) probe "$m_gw" "$gw" ;; esac
          printf '\n'
          probe "$m_ping $host" "$host"
        else
          printf '%s\n' "$m_noping"
        fi
        printf '\n'
        if command -v curl >/dev/null 2>&1; then
          if res="$(env -u SSLKEYLOGFILE curl -q -sS -L --proto '=https' --proto-redir '=https' --max-redirs 3 --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code} %{time_connect} %{time_appconnect} %{time_total}' "$url" 2>&1)"; then
            set -- $res
            case "$1" in 2*|3*) st="$m_ok" ;; *) st="$m_unexpected" ;; esac
            printf '%s %s: %s (HTTP %s; tcp %s s; tls %s s; total %s s)\n' "$m_https" "$url" "$st" "$1" "$2" "$3" "$4"
          else
            printf '%s %s: %s\n' "$m_https" "$url" "$m_fail"
            printf '%s\n' "$res" | tail -n 1
          fi
        else
          printf '%s\n' "$m_nocurl"
        fi
    timeout: 1m
  - id: wifi
    name: Wi-Fi atual
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_nonm="NetworkManager (nmcli) not available: Wi-Fi not checked"; m_nowifi="no Wi-Fi adapter found"; m_dev="Adapter"; m_net="network"; m_signal="Signal"; m_chan="channel"; m_rate="rate" ;;
          es) m_nonm="NetworkManager (nmcli) no disponible: Wi-Fi no verificado"; m_nowifi="no se encontró adaptador Wi-Fi"; m_dev="Adaptador"; m_net="red"; m_signal="Señal"; m_chan="canal"; m_rate="velocidad" ;;
          *) m_nonm="NetworkManager (nmcli) indisponível: Wi-Fi não verificado"; m_nowifi="nenhum adaptador Wi-Fi encontrado"; m_dev="Adaptador"; m_net="rede"; m_signal="Sinal"; m_chan="canal"; m_rate="taxa" ;;
        esac
        if ! command -v nmcli >/dev/null 2>&1; then printf '%s\n' "$m_nonm"; exit 0; fi
        st="$(nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device status 2>/dev/null | awk -F: -v d="$m_dev" -v n="$m_net" '$2 == "wifi" { c = ($4 == "" || $4 == "--") ? "-" : n ": " $4; printf "%s %s: %s, %s\n", d, $1, $3, c }')"
        if [ -z "$st" ]; then printf '%s\n' "$m_nowifi"; exit 0; fi
        printf '%s\n' "$st"
        nmcli -t -f IN-USE,SIGNAL,CHAN,RATE dev wifi list --rescan no 2>/dev/null | awk -F: -v s="$m_signal" -v c="$m_chan" -v r="$m_rate" '$1 == "*" { printf "%s: %s%%; %s %s; %s %s\n", s, $2, c, $3, r, $4; exit }'
    timeout: 30s
  - id: portas
    name: Portas TCP em escuta
    run:
      sh: |-
        L="${TOOLKIT_LANG:-${LC_ALL:-${LC_MESSAGES:-${LANG:-}}}}"
        case "$L" in en*|EN*) lang=en ;; es*|ES*) lang=es ;; *) lang=pt ;; esac
        case "$lang" in
          en) m_head="Listening TCP ports (only this machine / whole network)"; m_local="this machine only"; m_net="whole network"; m_none="no listening ports found"; m_noss="the 'ss' command is not available" ;;
          es) m_head="Puertos TCP en escucha (solo este equipo / toda la red)"; m_local="solo este equipo"; m_net="toda la red"; m_none="no se encontraron puertos en escucha"; m_noss="el comando 'ss' no está disponible" ;;
          *) m_head="Portas TCP em escuta (só esta máquina / toda a rede)"; m_local="só esta máquina"; m_net="toda a rede"; m_none="nenhuma porta em escuta"; m_noss="o comando 'ss' não existe" ;;
        esac
        if ! command -v ss >/dev/null 2>&1; then printf '%s\n' "$m_noss"; exit 0; fi
        printf '== %s\n' "$m_head"
        out="$(ss -ltn 2>/dev/null | awk -v l="$m_local" -v n="$m_net" 'NR > 1 { a = $4; p = a; sub(/.*:/, "", p); h = a; sub(/:[^:]*$/, "", h); gsub(/[][]/, "", h); if (h ~ /^127\./ || h == "::1") w = l; else w = n; print p " " w }' | sort -n | uniq | head -n 40)"
        if [ -z "$out" ]; then printf '%s\n' "$m_none"; else printf '%s\n' "$out"; fi
    timeout: 30s
