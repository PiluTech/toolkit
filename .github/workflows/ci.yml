name: ci

# Só manual por enquanto: o repositório é privado e a conta está sem orçamento de Actions.
# Quando for público, acrescente push e pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: golangci-lint v2.15.0 (binário oficial, SHA-256 de tools.sha256)
        shell: bash
        run: |
          ./scripts/instalar-ferramentas.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate
        shell: bash
        run: ./scripts/ci.sh
