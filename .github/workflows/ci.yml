name: ci

# Só manual por enquanto: o repositório é privado e a conta está sem orçamento de Actions.
# Quando for público, acrescente push e pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint v2.15.0
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: gate
        shell: bash
        run: ./scripts/ci.sh
